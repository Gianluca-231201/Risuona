<style>

}

*{box-sizing:border-box}

.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}

.rep1[data-m="one"]::after{content:"1";position:absolute;font:500 10px var(--mono);right:7px;top:6px}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 18px var(--display);margin-bottom:4px}
body.drag .empty,body.drag .deck{border-color:var(--accent)}
kbd{font:400 12px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.alb{margin-top:18px}
.alb h3{font:700 17px var(--display);margin:0;padding:8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}

li.miss{cursor:default;color:var(--muted)}
li.miss:hover{background:none}
.chip{margin-top:12px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{margin-top:16px}
.q{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit}
.bc{display:flex;gap:12px;align-items:center}
#back{color:var(--accent);font:500 13px var(--body);text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card:hover{border-color:var(--accent)}
.card b{font:700 16px/1.2 var(--display);overflow-wrap:anywhere}
.card small{color:var(--muted);font-size:12px}
.deck{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 24px rgba(0,0,0,.18)}
@media(max-width:600px){canvas{display:none}.deck{padding:14px;gap:10px}}
header{flex-wrap:nowrap}
.q{flex:1;min-width:0}
.add{flex:none;width:44px;height:44px;padding:0;font-size:26px;line-height:1}
.keys{color:var(--muted);font-size:13px}
:root:root:root{--bg:#0e1116;--surface:#1f252e;--ink:#f2f5f9;--muted:#98a2b1;--line:#333c49;--accent:#2f7bff;--accent-ink:#ffffff;--well:#161b22;--display:"Outfit",system-ui,sans-serif;--body:"Outfit",system-ui,sans-serif;color-scheme:dark}
body{padding-block:28px 190px;font-size:16px}

h1{font:700 clamp(34px,10vw,44px)/1 var(--display);flex:1;order:1;min-width:0}
.add{order:2;background:none;color:var(--ink);border:2px solid var(--ink);width:40px;height:40px;font-size:24px}
.q{order:3;flex:1 0 100%;border-radius:12px;border-color:transparent}

.grid{grid-template-columns:repeat(2,minmax(0,1fr))}

.card:nth-child(4n+3){--h:200}

.card b{align-self:end;font:500 16px/1.2 var(--display)}
.card small{align-self:start;font-size:13px}
.card:hover{background:var(--line)}
li{border-bottom:0}
.alb h3{font-size:22px}
.deck{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(696px,calc(100% - 24px));background:linear-gradient(135deg,#3b4654,#222933);color:#ffffff;border:0;border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;z-index:5;overflow:hidden}
.deck::before{content:"";position:absolute;top:0;left:0;height:3px;width:var(--p,0%);background:var(--accent)}
.deck canvas,.deck .seek,.deck .vol,.deck #shuf,.deck #rep,.deck #prev{display:none}
.deck .now{cursor:pointer}

.deck .now span{color:#b4bfcd}
.deck .ib{color:#ffffff}
.deck .ib.play{background:none;width:44px;height:44px}
.deck.open{grid-template-columns:minmax(0,1fr);gap:14px;padding:18px}
.deck.open::before{display:none}
.deck.open canvas{display:block;background:#171d25}

.deck.open .vol{display:flex;color:#b4bfcd}
.deck.open .t{color:#b4bfcd}
.deck.open #shuf,.deck.open #rep,.deck.open #prev{display:grid}

.deck .ib:hover,.deck .ib[aria-pressed="true"]{background:#171d25}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:linear-gradient(transparent,var(--bg) 40%);padding:22px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:4}

.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .on{color:var(--accent)}
.vol{display:none!important}
.deck canvas{display:block;grid-column:1/-1;height:40px;background:transparent;border-radius:6px}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(520px,100%);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sheet h4{margin:0 0 6px;font:500 17px/1.3 var(--display);overflow-wrap:anywhere}
.sheet button{text-align:left;padding:14px;border-radius:10px;background:var(--well);font-size:16px}
.sheet button.dg{color:#ff6b6b}
.sheet input{padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--well);color:var(--ink);font:inherit}
.toast{position:fixed;left:50%;bottom:200px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:30;font-size:14px;max-width:80%}
li .pl{width:32px;height:32px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
li .pl svg{width:20px;height:20px;fill:currentColor}
li,.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.plh{font:700 22px var(--display);margin:18px 0 0;padding:0 8px}
[hidden]{display:none!important}
#edit{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--well)}
#edit svg{width:17px;height:17px;fill:currentColor}
.mix{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:500 16px var(--display)}
.mix svg{width:20px;height:20px;fill:currentColor}
.ly{margin-left:8px;font:500 10px var(--mono);letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:#5a3b12;color:#ffc56b;white-space:nowrap}
.sheet h4{white-space:pre-line}
</style>

const norm=s=>' '+s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim()+' ';
const KEYS=[];
DISC.forEach((al,ai)=>al.tr.forEach((tr,ti)=>{const f=norm(tr[0]),s=norm(tr[0].replace(/\(.*?\)/g,''));KEYS.push([f,ai,ti]);if(s!==f&&s.trim())KEYS.push([s,ai,ti])}));
const ARTS=[...new Set(DISC.map(d=>d.ar))];
function match(name){const n=norm(name),as=ARTS.filter(a=>n.includes(norm(a)));let b=null,be=-1;for(const k of KEYS){if(as.length&&!as.includes(DISC[k[1]].ar))continue;const p=n.lastIndexOf(k[0]);if(p<0)continue;const e=p+k[0].length;if(e>be||(e===be&&k[0].length>b[0].length)){b=k;be=e}}return b}
let db;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('giradischi',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('f'))d.createObjectStore('f',{keyPath:'id'});if(!d.objectStoreNames.contains('img'))d.createObjectStore('img',{keyPath:'k'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej()}})}
idb().then(d=>{db=d;const g=d.transaction('img').objectStore('img').getAll();g.onsuccess=()=>{g.result.forEach(x=>IMG[x.k]=URL.createObjectURL(x.blob));render();const q=d.transaction('f').objectStore('f').getAll();q.onsuccess=()=>put(q.result,false)}}).catch(()=>{});
function add(files){
  put([...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|flac|ogg|m4a|aac|opus)$/i.test(f.name)).map(f=>({id:Date.now()+'-'+Math.random().toString(36).slice(2),name:f.name,blob:f})),true);
}
function put(recs,save){
  recs.forEach(r=>{
    const t={id:r.id,name:r.name.replace(/\.[^.]+$/,'').replace(/mp3j\.cc/i,''),url:URL.createObjectURL(r.blob),dur:NaN,ai:null,ti:null};
    const m=match(t.name);
    if(m&&!T.some(x=>x.ai===m[1]&&x.ti===m[2])){t.ai=m[1];t.ti=m[2];t.name=DISC[m[1]].tr[m[2]][0];const ck='al-'+m[1];if(!IMG[ck])cover(r.blob).then(b=>{if(b&&!IMG[ck])setImg(ck,b)})}
    T.push(t);
    const p=new Audio();p.preload='metadata';p.src=t.url;
    p.onloadedmetadata=()=>{t.dur=p.duration;render()};
    if(save&&db)try{db.transaction('f','readwrite').objectStore('f').put(r)}catch(e){}
  });
  const cur=T[i];
  T.sort((x,y)=>(x.ai??99)-(y.ai??99)||(x.ti??0)-(y.ti??0));
  if(cur)i=T.indexOf(cur);
  render();if(i<0&&T.length)load(0,false);
}
function row(n,name,d,k){
  const li=document.createElement('li');
  li.innerHTML='<span class="n">'+n+'</span><span class="nm"></span><span class="d">'+d+'</span>'+(k==null?'<span></span>':'<button class="x" title="Rimuovi file" aria-label="Rimuovi file">×</button>');
  li.children[1].textContent=name;
  if(k==null){li.className='miss';return li}
  li.tabIndex=0;if(k===i)li.className='on';
  li.onclick=e=>{if(e.target.classList.contains('x'))del(k);else load(k,true)};
  li.onkeydown=e=>{if(e.key==='Enter')load(k,true)};
  return li;
}

async function cover(f){try{
  const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
  if(h[0]!==73||h[1]!==68||h[2]!==51||h[3]<3)return null;
  const v=h[3],ss=(x,o)=>(x[o]<<21)|(x[o+1]<<14)|(x[o+2]<<7)|x[o+3],pl=(x,o)=>((x[o]<<24)|(x[o+1]<<16)|(x[o+2]<<8)|x[o+3])>>>0;
  const b=new Uint8Array(await f.slice(10,10+ss(h,6)).arrayBuffer());let p=0;
  if(h[5]&64)p=v===4?ss(b,0):pl(b,0)+4;
  while(p+10<=b.length&&b[p]){
    const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]),s=v===4?ss(b,p+4):pl(b,p+4);p+=10;
    if(id==='APIC'){
      let o=p,m='';const enc=b[o++],end=p+s;
      while(o<end&&b[o])m+=String.fromCharCode(b[o++]);o+=2;
      if(enc===1||enc===2){while(o+1<end&&(b[o]||b[o+1]))o+=2;o+=2}else{while(o<end&&b[o])o++;o++}
      return o<end?new Blob([b.subarray(o,end)],{type:m.includes('/')?m:'image/jpeg'}):null;
    }
    p+=s;
  }
}catch(e){}return null}

  const c=PL.map(p=>{const b=card(p.name,p.ids.filter(id=>T.some(t=>t.id===id)).length+' brani',()=>{view={l:5,pid:p.id};clr()},'pl-'+p.id);lp(b,()=>plMenu(p));return b});
  c.push(card('Nuova playlist','Crea',()=>newPl()));
  const h=document.createElement('h3');h.className='plh';h.textContent='Playlist';l.appendChild(h);grid(l,c);
  const ly=T.map((t,k)=>[t,k]).filter(x=>x[0].ly);
  if(ly.length)sect(l,'Versioni lyrics da controllare','',ly.length,ly.map((x,n)=>row(n+1,x[0].name,fmt(x[0].dur),x[1])));
  if(T.length)sect(l,'Brani caricati','',T.length,T.map((t,k)=>row(k+1,t.name,fmt(t.dur),k)));
  else pmsg(l,'Nessun brano caricato. Premi + per aggiungere i tuoi file.');
  const hn=Object.keys(HID).length;if(hn)chip(l,'Ripristina brani eliminati dall\'elenco ('+hn+')',()=>{HID={};saveH();render()});
  const bh=document.createElement('h3');bh.className='plh';bh.textContent='Backup';l.appendChild(bh);
  chip(l,'Salva backup',doBackup);chip(l,'Ripristina backup',()=>Android.restore());
}
function plView(l){
  const p=PL.find(x=>x.id===view.pid);
  if(!p){view={l:4};libView(l);return 'Libreria'}
  const rows=[];p.ids.forEach(id=>{const k=T.findIndex(t=>t.id===id);if(k>=0)rows.push(row(rows.length+1,T[k].name,fmt(T[k].dur),k))});
  if(rows.length)sect(l,p.name,'',rows.length,rows);else pmsg(l,'Playlist vuota. Aggiungi brani con il tasto accanto al titolo.');
  return p.name;
}
$('back').onclick=()=>{view=view.l===2?{l:1,ar:DISC[view.ai].ar}:view.l===5?{l:4}:{l:0};render()};
$('edit').onclick=()=>{
  if(view.l===5){const p=PL.find(x=>x.id===view.pid);if(p)plMenu(p);return}
  const isAl=view.l===2,d=isAl?DISC[view.ai]:null,ar=isAl?d.ar:view.ar,rk=isAl?'al|'+d.ar+'|'+d.t:'ar|'+ar,cur=isAl?dal(d):dn(ar),ik=isAl?akA(view.ai):agk(ar);
  sheet(isAl?'Modifica album':'Modifica artista',[
    ['Cambia foto',()=>{pk=ik;$('imgf').click()}],
    ['Cambia nome',()=>sheet('Nuovo nome',[['Salva',v=>{if(!v)return;if(v===(isAl?d.t:ar))delete REN[rk];else REN[rk]=v;try{localStorage.setItem('rs_ren',JSON.stringify(REN))}catch(e){}if(isAl&&d.dyn)view={l:1,ar:ar};sync.done=0;sync()}],['Annulla']],'Nome',cur)],
    ['Annulla']]);
};
function lpc(b,fn){lp(b,fn);return b}
function renS(rk,orig,cur,after){sheet('Nuovo nome',[['Salva',v=>{if(!v)return;if(v===orig)delete REN[rk];else REN[rk]=v;try{localStorage.setItem('rs_ren',JSON.stringify(REN))}catch(e){}if(after)after();sync.done=0;sync()}],['Annulla']],'Nome',cur)}
function editAr(ar){sheet(dn(ar),[['Cambia foto',()=>{pk=agk(ar);$('imgf').click()}],['Cambia nome',()=>renS('ar|'+ar,ar,dn(ar))],['Annulla']])}
function editAl(ai){const d=DISC[ai];if(!d)return;sheet(dal(d),[['Cambia foto',()=>{pk=akA(ai);$('imgf').click()}],['Cambia nome',()=>renS('al|'+d.ar+'|'+d.t,d.t,dal(d),()=>{if(d.dyn&&view.l===2)view={l:1,ar:d.ar}})],['Annulla']])}
window.onViz=function(a){VZ=a};
function draw(){
  const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
  if(r.width&&cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
  const W=cv.width,H=cv.height,cs=getComputedStyle(document.documentElement),n=32,g=3*dpr,bw=(W-g*(n+1))/n,on=!!(window.nat&&nat.playing);
  cx.clearRect(0,0,W,H);
  cx.fillStyle=cs.getPropertyValue(on?'--accent':'--line');
  for(let k=0;k<n;k++){
    const t=on?(VZ[k]||0):0;VC[k]=(VC[k]||0)+(t-(VC[k]||0))*(t>(VC[k]||0)?.55:.18);
    const h=Math.max(2*dpr,VC[k]*(H-4*dpr));
    cx.fillRect(g+k*(bw+g),H-2*dpr-h,bw,h);
  }
  requestAnimationFrame(draw);
}
function mixBtn(l){
  const b=document.createElement('button');b.className='mix';
  b.innerHTML='<svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-2.3 3.1-1.3-1.7L13.4 6H17V3zM3 6h4.6l8 12H17v-3l4 4-4 4v-3h-2.6l-8-12H3V6zm0 12h3.4l2.2-3.3 1.2 1.8L7.6 20H3v-2z"/></svg><span>Riproduzione casuale</span>';
  b.onclick=()=>{if(!T.length)return;shuf=true;$('shuf').setAttribute('aria-pressed',true);Android.shuffle(true);load(Math.floor(Math.random()*T.length),true)};
  l.appendChild(b);
}
function doBackup(){
  toast('Preparo il backup…');
  Promise.all(Object.keys(IMG).map(k=>fetch(IMG[k]).then(r=>r.blob()).then(toJpg).then(b=>[k,b]).catch(()=>null))).then(a=>{
    const img={};a.forEach(x=>{if(x)img[x[0]]=x[1]});
    Android.backup(JSON.stringify({pl:PL,ren:REN,hid:HID,img:img}));
  });
}
window.onRestore=function(web){
  try{
    const w=JSON.parse(web||'{}');
    (w.pl||[]).forEach(p=>{if(p&&p.id&&!PL.some(x=>x.id===p.id))PL.push(p)});saveP();
    Object.keys(w.ren||{}).forEach(k=>{if(!(k in REN))REN[k]=w.ren[k]});try{localStorage.setItem('rs_ren',JSON.stringify(REN))}catch(e){}
    Object.keys(w.hid||{}).forEach(k=>{HID[k]=1});saveH();
    Object.keys(w.img||{}).forEach(k=>{if(!IMG[k]){tried[k]=1;try{_si(k,b64blob(w.img[k]))}catch(e){}}});
    sync.done=0;sync();toast('Backup ripristinato');
  }catch(e){toast('File di backup non valido')}
};
function isLy(r){return /\b(lyrics?|testo|karaoke)\b/i.test((r.name+' '+(r.tt||'')).replace(/_/g,' '))}
function swapLy(L){
  const g={};
  L.forEach(r=>{
    const raw=r.name.replace(/\.[^.]+$/,'').replace(/mp3j\.cc/i,'').replace(/_/g,' ').replace(/[\(\[]?\s*\b(official\s+)?(lyrics?(\s+video)?|testo|karaoke)\b\s*[\)\]]?/ig,' ').trim();
    const m=match(raw),k=m?'c'+m[1]+'-'+m[2]:'n'+norm(raw);
    (g[k]=g[k]||[]).push(r);
  });
  let n=0;
  Object.keys(g).forEach(k=>{
    const a=g[k],keep=a.find(r=>!isLy(r));
    if(!keep)return;
    a.filter(isLy).forEach(r=>{
      PL.forEach(p=>{p.ids=p.ids.map(x=>x===r.id?keep.id:x).filter((x,j,arr)=>arr.indexOf(x)===j)});
      Android.remove(r.id);n++;
    });
  });
  if(!n)return L;
  saveP();toast(n===1?'Sostituita 1 versione lyrics':'Sostituite '+n+' versioni lyrics');
  return JSON.parse(Android.library());
}
