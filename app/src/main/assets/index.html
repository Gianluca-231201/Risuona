<!doctype html>
<html lang="it">
<title>Risuona</title>
<meta name="theme-color" content="#12131c">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: una colonna, deck in alto (spettro + trasporto), scaletta sotto */
:root{
  --bg:#e9eeec;--surface:#f8faf9;--ink:#14201e;--muted:#5a6966;--line:#cfd8d5;
  --accent:#0b7a6b;--accent-ink:#ffffff;--well:#dfe6e3;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716;--surface:#172220;--ink:#e6efec;--muted:#8fa19d;--line:#2a3936;
  --accent:#47cdb5;--accent-ink:#06211c;--well:#101a18;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716;--surface:#172220;--ink:#e6efec;--muted:#8fa19d;--line:#2a3936;
  --accent:#47cdb5;--accent-ink:#06211c;--well:#101a18;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);margin:0;padding-inline:16px;padding-block:24px 40px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font:700 22px/1 var(--display);margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{background:var(--accent);color:var(--accent-ink);font-weight:500;padding:9px 16px;border-radius:999px}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
canvas{width:100%;height:120px;display:block;background:var(--well);border-radius:8px}
.now{min-width:0}
.now b{display:block;font:700 clamp(20px,5vw,28px)/1.15 var(--display);text-wrap:balance;overflow-wrap:anywhere}
.now span{color:var(--muted);font-size:13px}
.seek{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.t{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);min-width:42px}
.t:last-child{text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:6px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--well)}
.ib svg{width:20px;height:20px;fill:currentColor}
.ib[aria-pressed="true"]{color:var(--accent);background:var(--well)}
.ib.play{width:56px;height:56px;background:var(--accent);color:var(--accent-ink)}
.ib.play svg{width:24px;height:24px}
.ib[disabled]{opacity:.4;cursor:default}
.vol{display:flex;align-items:center;gap:8px;width:150px;color:var(--muted)}
.vol svg{width:18px;height:18px;fill:currentColor;flex:none}
.rep1{position:relative}
.rep1[data-m="one"]::after{content:"1";position:absolute;font:500 10px var(--mono);right:7px;top:6px}
h2{font:500 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;justify-content:space-between}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:grid;grid-template-columns:28px 1fr auto 32px;gap:10px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
li:hover{background:var(--surface)}
li .n{font:400 13px var(--mono);color:var(--muted);text-align:right}
li .nm{min-width:0;overflow-wrap:anywhere}
li .d{font:400 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
li.on .nm{color:var(--accent);font-weight:500}
li.on .n{color:var(--accent)}
li .x{width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:18px;line-height:1}
li .x:hover{background:var(--well);color:var(--ink)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 18px var(--display);margin-bottom:4px}
body.drag .empty,body.drag .deck{border-color:var(--accent)}
kbd{font:400 12px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.alb{margin-top:18px}
.alb h3{font:700 17px var(--display);margin:0;padding:8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.alb h3 small{font:400 12px var(--mono);color:var(--muted);white-space:nowrap}
li.miss{cursor:default;color:var(--muted)}
li.miss:hover{background:none}
.chip{margin-top:12px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{margin-top:16px}
.q{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit}
.bc{display:flex;gap:12px;align-items:center}
#back{color:var(--accent);font:500 13px var(--body);text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card:hover{border-color:var(--accent)}
.card b{font:700 16px/1.2 var(--display);overflow-wrap:anywhere}
.card small{color:var(--muted);font-size:12px}
.deck{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 24px rgba(0,0,0,.18)}
@media(max-width:600px){canvas{display:none}.deck{padding:14px;gap:10px}}
header{flex-wrap:nowrap}
.q{flex:1;min-width:0}
.add{flex:none;width:44px;height:44px;padding:0;font-size:26px;line-height:1}
.keys{color:var(--muted);font-size:13px}
:root:root:root{--bg:#12131c;--surface:#20222c;--ink:#ffffff;--muted:#9a9ca8;--line:#2c2f3b;--accent:#22c55e;--accent-ink:#04130a;--well:#191b24;--display:"Outfit",system-ui,sans-serif;--body:"Outfit",system-ui,sans-serif;color-scheme:dark}
body{padding-block:28px 190px;font-size:16px}
header{flex-wrap:wrap}
h1{font:700 clamp(34px,10vw,44px)/1 var(--display);flex:1;order:1;min-width:0}
.add{order:2;background:none;color:var(--ink);border:2px solid var(--ink);width:40px;height:40px;font-size:24px}
.q{order:3;flex:1 0 100%;border-radius:12px;border-color:transparent}
h2{align-items:center}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{display:grid;grid-template-columns:60px minmax(0,1fr);column-gap:12px;row-gap:2px;padding:8px;border:0;border-radius:12px;align-items:center}
.card::before{content:"";grid-row:1/3;width:60px;height:60px;border-radius:8px;background:linear-gradient(135deg,hsl(var(--h,150) 70% 45%),hsl(calc(var(--h,150) + 80) 70% 45%))}
.card[data-i]::before{background:var(--img)}
.card:nth-child(4n+2){--h:260}
.card:nth-child(4n+3){--h:330}
.card:nth-child(4n){--h:30}
.card b{align-self:end;font:500 16px/1.2 var(--display)}
.card small{align-self:start;font-size:13px}
.card:hover{background:var(--line)}
li{border-bottom:0}
.alb h3{font-size:22px}
.deck{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(696px,calc(100% - 24px));background:#0e3a4a;color:#ffffff;border:0;border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;z-index:5;overflow:hidden}
.deck::before{content:"";position:absolute;top:0;left:0;height:3px;width:var(--p,0%);background:var(--accent)}
.deck canvas,.deck .seek,.deck .vol,.deck #shuf,.deck #rep,.deck #prev{display:none}
.deck .now{cursor:pointer}
.deck .now b{font:500 18px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .now span{color:#b8cfd6}
.deck .ib{color:#ffffff}
.deck .ib.play{background:none;width:44px;height:44px}
.deck.open{grid-template-columns:minmax(0,1fr);gap:14px;padding:18px}
.deck.open::before{display:none}
.deck.open canvas{display:block;background:#0a2c39}
.deck.open .seek{display:grid}
.deck.open .vol{display:flex;color:#b8cfd6}
.deck.open .t{color:#b8cfd6}
.deck.open #shuf,.deck.open #rep,.deck.open #prev{display:grid}
.deck.open .ib.play{background:var(--accent);color:var(--accent-ink);width:56px;height:56px}
.deck .ib:hover,.deck .ib[aria-pressed="true"]{background:#0a2c39}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:linear-gradient(transparent,var(--bg) 40%);padding:22px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:4}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font:500 12px var(--body);min-width:72px}
.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .on{color:var(--accent)}
.vol,canvas{display:none!important}
#only{display:none}
</style>
<div class="wrap">
  <header>
    <h1 id="hi">Risuona</h1>
    <input type="search" id="q" class="q" placeholder="Cerca artista, album o brano" aria-label="Cerca">
    <button class="add" id="addBtn" title="Aggiungi brani" aria-label="Aggiungi brani">+</button>
    <input type="file" id="file" accept="audio/*" multiple hidden>
    <input type="file" id="imgf" accept="image/*" hidden>
  </header>


  <section>
    <h2><span class="bc"><button id="back" hidden>‹ Indietro</button><span id="crumb">Artisti</span></span><span id="count"></span></h2>
    <button class="chip" id="only" aria-pressed="false">Solo brani caricati</button>
    <div id="list"></div>
    <div class="empty" id="empty"><b>Nessun file caricato</b>Premi “+” in alto e scegli i tuoi MP3: vengono ordinati per artista e album.</div>
  </section>
  <p class="keys">L’abbinamento usa il nome del file, che deve contenere il titolo del brano. I file restano salvati in questo browser.</p>
  <section class="deck">
    <canvas id="cv" width="680" height="120" aria-hidden="true"></canvas>
    <div class="now"><b id="title">Nessun brano</b><span id="sub">Carica i tuoi file audio</span></div>
    <div class="seek">
      <span class="t" id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posizione">
      <span class="t" id="dur">0:00</span>
    </div>
    <div class="ctl">
      <div class="grp">
        <button class="ib" id="shuf" aria-pressed="false" title="Casuale"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-2.3 3.1-1.3-1.7L13.4 6H17V3zM3 6h4.6l8 12H17v-3l4 4-4 4v-3h-2.6l-8-12H3V6zm0 12h3.4l2.2-3.3 1.2 1.8L7.6 20H3v-2z"/></svg></button>
        <button class="ib" id="prev" title="Precedente"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ib play" id="play" title="Riproduci"><svg viewBox="0 0 24 24"><path id="pi" d="M7 4v16l13-8z"/></svg></button>
        <button class="ib" id="next" title="Successivo"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button class="ib rep1" id="rep" data-m="off" aria-pressed="false" title="Ripeti"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
      </div>
      <label class="vol"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4zm12 3a4 4 0 0 0-2-3.5v7A4 4 0 0 0 16 12z"/></svg>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></label>
    </div>
  </section>
  <nav class="nav">
    <button id="nHome" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button id="nSearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Cerca</button>
    <button id="nLib"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Libreria</button>
  </nav>
</div>
<script>
const $=id=>document.getElementById(id);
const a=new Audio(),T=[];let i=-1,only=false,shuf=false,rep='off',ac,an,buf,seeking=false;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'–:––';
try{const v=localStorage.getItem('gd_vol');if(v!==null)$('vol').value=v}catch(e){}
a.volume=+$('vol').value;

const D=(t,y,s,ar='Ultimo')=>({t,y,ar,tr:s.split(';').map(x=>x.split('|'))});
const DISC=[];
const norm=s=>' '+s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim()+' ';
const KEYS=[];
DISC.forEach((al,ai)=>al.tr.forEach((tr,ti)=>{const f=norm(tr[0]),s=norm(tr[0].replace(/\(.*?\)/g,''));KEYS.push([f,ai,ti]);if(s!==f&&s.trim())KEYS.push([s,ai,ti])}));
const ARTS=[...new Set(DISC.map(d=>d.ar))];
function match(name){const n=norm(name),as=ARTS.filter(a=>n.includes(norm(a)));let b=null,be=-1;for(const k of KEYS){if(as.length&&!as.includes(DISC[k[1]].ar))continue;const p=n.lastIndexOf(k[0]);if(p<0)continue;const e=p+k[0].length;if(e>be||(e===be&&k[0].length>b[0].length)){b=k;be=e}}return b}
let db;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('giradischi',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('f'))d.createObjectStore('f',{keyPath:'id'});if(!d.objectStoreNames.contains('img'))d.createObjectStore('img',{keyPath:'k'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej()}})}
idb().then(d=>{db=d;const g=d.transaction('img').objectStore('img').getAll();g.onsuccess=()=>{g.result.forEach(x=>IMG[x.k]=URL.createObjectURL(x.blob));render();const q=d.transaction('f').objectStore('f').getAll();q.onsuccess=()=>put(q.result,false)}}).catch(()=>{});
function add(files){
  put([...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|flac|ogg|m4a|aac|opus)$/i.test(f.name)).map(f=>({id:Date.now()+'-'+Math.random().toString(36).slice(2),name:f.name,blob:f})),true);
}
function put(recs,save){
  recs.forEach(r=>{
    const t={id:r.id,name:r.name.replace(/\.[^.]+$/,'').replace(/mp3j\.cc/i,''),url:URL.createObjectURL(r.blob),dur:NaN,ai:null,ti:null};
    const m=match(t.name);
    if(m&&!T.some(x=>x.ai===m[1]&&x.ti===m[2])){t.ai=m[1];t.ti=m[2];t.name=DISC[m[1]].tr[m[2]][0];const ck='al-'+m[1];if(!IMG[ck])cover(r.blob).then(b=>{if(b&&!IMG[ck])setImg(ck,b)})}
    T.push(t);
    const p=new Audio();p.preload='metadata';p.src=t.url;
    p.onloadedmetadata=()=>{t.dur=p.duration;render()};
    if(save&&db)try{db.transaction('f','readwrite').objectStore('f').put(r)}catch(e){}
  });
  const cur=T[i];
  T.sort((x,y)=>(x.ai??99)-(y.ai??99)||(x.ti??0)-(y.ti??0));
  if(cur)i=T.indexOf(cur);
  render();if(i<0&&T.length)load(0,false);
}
function row(n,name,d,k){
  const li=document.createElement('li');
  li.innerHTML='<span class="n">'+n+'</span><span class="nm"></span><span class="d">'+d+'</span>'+(k==null?'<span></span>':'<button class="x" title="Rimuovi file" aria-label="Rimuovi file">×</button>');
  li.children[1].textContent=name;
  if(k==null){li.className='miss';return li}
  li.tabIndex=0;if(k===i)li.className='on';
  li.onclick=e=>{if(e.target.classList.contains('x'))del(k);else load(k,true)};
  li.onkeydown=e=>{if(e.key==='Enter')load(k,true)};
  return li;
}
function sect(l,t,y,c,rows){
  const s=document.createElement('section');s.className='alb';
  const h=document.createElement('h3');h.innerHTML='<span></span><small></small>';
  h.children[0].textContent=t;h.children[1].textContent=(y?y+' · ':'')+c;
  const ol=document.createElement('ol');rows.forEach(r=>ol.appendChild(r));
  s.append(h,ol);l.appendChild(s);
}
let view={l:0},q='';
const IMG={};let pk=null;
function card(t,s,fn,k){const b=document.createElement('button');b.className='card';b.innerHTML='<b></b><small></small>';b.children[0].textContent=t;b.children[1].textContent=s;b.onclick=fn;if(k&&IMG[k]){b.dataset.i=1;b.style.setProperty('--img','url("'+IMG[k]+'") center/cover')}return b}
function pick(l,k,txt){const b=document.createElement('button');b.className='chip';b.textContent=txt;b.onclick=()=>{pk=k;$('imgf').click()};l.appendChild(b)}
function setImg(k,blob){if(IMG[k])URL.revokeObjectURL(IMG[k]);IMG[k]=URL.createObjectURL(blob);if(db)try{db.transaction('img','readwrite').objectStore('img').put({k,blob})}catch(e){}render()}
async function cover(f){try{
  const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
  if(h[0]!==73||h[1]!==68||h[2]!==51||h[3]<3)return null;
  const v=h[3],ss=(x,o)=>(x[o]<<21)|(x[o+1]<<14)|(x[o+2]<<7)|x[o+3],pl=(x,o)=>((x[o]<<24)|(x[o+1]<<16)|(x[o+2]<<8)|x[o+3])>>>0;
  const b=new Uint8Array(await f.slice(10,10+ss(h,6)).arrayBuffer());let p=0;
  if(h[5]&64)p=v===4?ss(b,0):pl(b,0)+4;
  while(p+10<=b.length&&b[p]){
    const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]),s=v===4?ss(b,p+4):pl(b,p+4);p+=10;
    if(id==='APIC'){
      let o=p,m='';const enc=b[o++],end=p+s;
      while(o<end&&b[o])m+=String.fromCharCode(b[o++]);o+=2;
      if(enc===1||enc===2){while(o+1<end&&(b[o]||b[o+1]))o+=2;o+=2}else{while(o<end&&b[o])o++;o++}
      return o<end?new Blob([b.subarray(o,end)],{type:m.includes('/')?m:'image/jpeg'}):null;
    }
    p+=s;
  }
}catch(e){}return null}
function grid(l,items){const g=document.createElement('div');g.className='grid';items.forEach(x=>g.appendChild(x));l.appendChild(g)}
function clr(){q='';$('q').value='';render();scrollTo(0,0)}
function render(){
  const l=$('list');l.innerHTML='';const map={};
  T.forEach((t,k)=>{if(t.ai!=null)map[t.ai+'-'+t.ti]=k});
  const have=ai=>DISC[ai].tr.filter((_,ti)=>map[ai+'-'+ti]!=null).length;
  const tot=DISC.reduce((s,d)=>s+d.tr.length,0),hv=T.filter(t=>t.ai!=null).length;
  const oth=T.map((t,k)=>[t,k]).filter(x=>x[0].ai==null);
  const trows=(ai,f)=>{const r=[];DISC[ai].tr.forEach((tr,ti)=>{const k=map[ai+'-'+ti];if(f&&!f(tr[0]))return;if(k!=null||!only)r.push(row(ti+1,tr[0],k!=null&&isFinite(T[k].dur)?fmt(T[k].dur):tr[1]||'',k))});return r};
  const orows=f=>oth.filter(x=>!f||f(x[0].name)).map((x,n)=>row(n+1,x[0].name,fmt(x[0].dur),x[1]));
  const ids=a=>DISC.map((_,ai)=>ai).filter(ai=>DISC[ai].ar===a);
  const akey=a=>a==='Ultimo'?'ar':'ar-'+a;
  const acard=(ai,wa)=>card(DISC[ai].t,(wa===1?DISC[ai].ar+' · ':'')+(DISC[ai].y?DISC[ai].y+' · ':'')+have(ai)+'/'+DISC[ai].tr.length,()=>{view={l:2,ai};clr()},akA(ai));
  const arcard=a=>{const x=ids(a);return card(a,x.length+' album · '+x.reduce((s,ai)=>s+have(ai),0)+'/'+x.reduce((s,ai)=>s+DISC[ai].tr.length,0),()=>{view={l:1,ar:a};clr()},akey(a))};
  const msg=s=>{const p=document.createElement('p');p.className='keys';p.textContent=s;l.appendChild(p)};
  let crumb='Artisti';
  if(q){
    crumb='Risultati';const n=norm(q).trim(),hit=s=>norm(s).includes(n);
    const c=ARTS.filter(hit).map(arcard).concat(DISC.map((_,ai)=>ai).filter(ai=>hit(DISC[ai].t)).map(ai=>acard(ai,1)));
    let any=c.length;if(any)grid(l,c);
    DISC.forEach((d,ai)=>{const r=trows(ai,hit);if(r.length){any++;sect(l,d.t,d.ar,r.length,r)}});
    const o=orows(hit);if(o.length){any++;sect(l,'Altri file','',o.length,o)}
    if(!any)msg('Nessun risultato per “'+q+'”.');
  }else if(view.l===0){
    const c=ARTS.map(arcard);if(oth.length)c.push(card('Altri file',oth.length+' brani',()=>{view={l:3};clr()}));grid(l,c);
  }else if(view.l===1){
    crumb=view.ar;pick(l,akey(view.ar),'Scegli foto artista');grid(l,ids(view.ar).map(ai=>acard(ai)));
  }else if(view.l===2){
    const d=DISC[view.ai],r=trows(view.ai);crumb=d.ar;pick(l,akA(view.ai),'Scegli copertina');
    if(r.length)sect(l,d.t,d.y,have(view.ai)+'/'+d.tr.length,r);else msg('Nessun brano caricato per questo album.');
  }else if(view.l===4){
    crumb='Libreria';
    if(T.length)sect(l,'Brani caricati','',T.length,T.map((t,k)=>row(k+1,t.name,fmt(t.dur),k)));else msg('Nessun brano caricato. Premi + per aggiungere i tuoi file.');
  }else{
    crumb='Altri file';const o=orows();if(o.length)sect(l,'Altri file','',o.length,o);else{view={l:0};return render()}
  }
  $('crumb').textContent=crumb;$('back').hidden=!!q||view.l===0;
  $('empty').hidden=T.length>0;
  $('count').textContent=hv+'/'+tot+' brani';
  ['prev','next','play'].forEach(b=>$(b).disabled=!T.length);
}
$('q').oninput=e=>{q=e.target.value.trim();render()};
$('back').onclick=()=>{view=view.l===2?{l:1,ar:DISC[view.ai].ar}:{l:0};render()};
function del(k){
  URL.revokeObjectURL(T[k].url);
  if(db)try{db.transaction('f','readwrite').objectStore('f').delete(T[k].id)}catch(e){}
  T.splice(k,1);
  if(k===i){a.pause();a.removeAttribute('src');i=-1;if(T.length)load(Math.min(k,T.length-1),false);else{$('title').textContent='Nessun brano';$('sub').textContent='Carica i tuoi file audio';$('cur').textContent=$('dur').textContent='0:00';$('seek').value=0}}
  else if(k<i)i--;
  render();
}
function load(k,play){
  i=k;const t=T[k],al=t.ai!=null?DISC[t.ai]:null;a.src=t.url;$('title').textContent=t.name;
  $('sub').textContent=al?al.ar+' · '+al.t+(al.y?' · '+al.y:''):'File locale';
  if('mediaSession'in navigator)try{navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:al?al.ar:'',album:al?al.t:''})}catch(e){}
  render();if(play)go();
}
$('only').onclick=e=>{only=!only;e.currentTarget.setAttribute('aria-pressed',only);render()};
function go(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=128;buf=new Uint8Array(an.frequencyBinCount);ac.createMediaElementSource(a).connect(an);an.connect(ac.destination)}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  a.play().catch(()=>{});
}
function step(d){
  if(!T.length)return;
  let k;
  if(shuf&&T.length>1){do{k=Math.floor(Math.random()*T.length)}while(k===i)}
  else k=(i+d+T.length)%T.length;
  load(k,true);
}
$('addBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{add(e.target.files);e.target.value=''};
$('play').onclick=()=>{if(i<0)return;a.paused?go():a.pause()};
$('next').onclick=()=>step(1);
$('prev').onclick=()=>{if(a.currentTime>3)a.currentTime=0;else step(-1)};
$('shuf').onclick=e=>{shuf=!shuf;e.currentTarget.setAttribute('aria-pressed',shuf)};
$('rep').onclick=e=>{rep=rep==='off'?'all':rep==='all'?'one':'off';const b=e.currentTarget;b.dataset.m=rep;b.setAttribute('aria-pressed',rep!=='off');b.title=rep==='off'?'Ripeti':rep==='all'?'Ripeti tutti':'Ripeti brano'};
$('vol').oninput=e=>{a.volume=+e.target.value;try{localStorage.setItem('gd_vol',e.target.value)}catch(x){}};
$('seek').oninput=()=>{seeking=true;$('cur').textContent=fmt(a.duration*$('seek').value/1000)};
$('seek').onchange=()=>{if(isFinite(a.duration))a.currentTime=a.duration*$('seek').value/1000;seeking=false};
a.onplay=()=>{$('pi').setAttribute('d','M6 4h4v16H6zM14 4h4v16h-4z');$('play').title='Pausa'};
a.onpause=()=>{$('pi').setAttribute('d','M7 4v16l13-8z');$('play').title='Riproduci'};
a.ontimeupdate=()=>{if(seeking)return;$('cur').textContent=fmt(a.currentTime);if(isFinite(a.duration))$('seek').value=a.currentTime/a.duration*1000};
a.onloadedmetadata=()=>{$('dur').textContent=fmt(a.duration)};
a.onended=()=>{
  if(rep==='one'){a.currentTime=0;go()}
  else if(shuf||i<T.length-1||rep==='all')step(1);
};
a.onerror=()=>{if(i>=0&&a.src)$('sub').textContent='Formato non supportato da questo browser'};
if('mediaSession'in navigator)try{
  navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));
  navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));
}catch(e){}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON'&&e.code==='Space')return;
  if(e.code==='Space'){e.preventDefault();$('play').click()}
  else if(e.key==='ArrowRight')a.currentTime+=5;
  else if(e.key==='ArrowLeft')a.currentTime-=5;
  else if(e.key==='n'||e.key==='N')step(1);
  else if(e.key==='p'||e.key==='P')step(-1);
});
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drag')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');add(e.dataTransfer.files)});

const cv=$('cv'),cx=cv.getContext('2d');
function draw(){
  const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
  if(cv.width!==Math.round(r.width*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
  const W=cv.width,H=cv.height,cs=getComputedStyle(document.documentElement);
  cx.clearRect(0,0,W,H);
  const n=48,g=3*dpr,bw=(W-g*(n+1))/n,live=an&&!a.paused;
  if(live)an.getByteFrequencyData(buf);
  for(let k=0;k<n;k++){
    const v=live?buf[k]/255:0,h=Math.max(2*dpr,v*(H-12*dpr));
    cx.fillStyle=cs.getPropertyValue(live?'--accent':'--line');
    cx.fillRect(g+k*(bw+g),H-6*dpr-h,bw,h);
  }
  requestAnimationFrame(draw);
}
$('imgf').onchange=e=>{const f=e.target.files[0];if(f&&pk)setImg(pk,f);e.target.value=''};
const dk=document.querySelector('.deck');
document.querySelector('.now').onclick=()=>dk.classList.toggle('open');
a.addEventListener('timeupdate',()=>dk.style.setProperty('--p',(isFinite(a.duration)?a.currentTime/a.duration*100:0)+'%'));
const nav=()=>{$('nHome').classList.toggle('on',view.l!==4);$('nLib').classList.toggle('on',view.l===4)};
$('nHome').onclick=()=>{view={l:0};clr();nav()};
$('nSearch').onclick=()=>{scrollTo(0,0);$('q').focus()};
$('nLib').onclick=()=>{view={l:4};clr();nav()};
$('back').addEventListener('click',nav);
render();draw();
/* ---- riproduzione nativa ---- */
var tried={},synced=0,nat={};
function put(){if(!synced){synced=1;sync()}}
function add(){Android.add()}
function go(){}
function step(){}
function b64blob(b){return new Blob([Uint8Array.from(atob(b),c=>c.charCodeAt(0))])}
function toJpg(blob){return createImageBitmap(blob).then(im=>{const s=Math.min(1,512/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85).split(',')[1]})}
var _si=setImg;
setImg=function(k,blob){_si(k,blob);const d=DISC[KD[k]!=null?KD[k]:k.indexOf('al-')===0?+k.slice(3):-1];if(d){toJpg(blob).then(b=>Android.setArt(d.ar,d.t,b)).catch(()=>{})}};
function show(t){const al=t&&t.ai!=null?DISC[t.ai]:null;$('title').textContent=t?t.name:'Nessun brano';$('sub').textContent=!t?'Carica i tuoi file audio':al?al.ar+' · '+al.t+(al.y?' · '+al.y:''):'File locale'}
var NST=DISC.length,NAR=ARTS.length,KD={};
function akA(ai){const d=DISC[ai];return d&&d.dyn?'ald-'+d.ar+'|'+d.t:'al-'+ai}
function dynAlbum(ar,al){let ai=DISC.findIndex((d,x)=>x>=NST&&d.ar===ar&&d.t===al);if(ai<0){DISC.push({t:al,y:'',ar:ar,tr:[],dyn:1});ai=DISC.length-1;if(!ARTS.includes(ar))ARTS.push(ar)}return ai}
function sync(){
  const L=JSON.parse(Android.library()),cur=nat.id||(T[i]?T[i].id:''),meta=[],arts=[];
  T.length=0;DISC.length=NST;ARTS.length=NAR;KD={};
  const cat=ARTS.slice(),isCat=s=>{if(!s)return;const n=norm(s);return cat.find(a=>n.includes(norm(a)))};
  L.forEach(r=>{
    const raw=r.name.replace(/\.[^.]+$/,'').replace(/mp3j\.cc/i,'').replace(/_/g,' ').trim();
    const t={id:r.id,name:raw,dur:r.dur?r.dur/1000:NaN,ai:null,ti:null};
    const sp=raw.split(/\s+-\s+/),pre=sp.length>1&&!/^\d+$/.test(sp[0].trim())?sp[0].trim():'';
    const tagAr=(r.ta||'').trim(),known=isCat(tagAr)||isCat(raw),foreign=!known&&(tagAr||pre);
    let m=foreign?null:match(raw);
    if(m&&T.some(x=>x.ai===m[1]&&x.ti===m[2]))m=null;
    if(m){t.ai=m[1];t.ti=m[2];t.name=DISC[m[1]].tr[m[2]][0]}
    else{
      const ar=known||tagAr||pre;
      if(ar){
        const title=(r.tt||'').trim()||(sp.length>1?sp.slice(1).join(' - ').trim():'')||raw;
        const ai=dynAlbum(ar,(r.tal||'').trim()||'Brani');
        t.ai=ai;t.name=title;t.tn=r.tn||999;DISC[ai].tr.push([title,'',t]);
      }
    }
    T.push(t);
  });
  for(let ai=NST;ai<DISC.length;ai++){const d=DISC[ai];d.tr.sort((a,b)=>a[2].tn-b[2].tn||a[0].localeCompare(b[0]));d.tr.forEach((x,k)=>{x[2].ti=k;x.length=2})}
  T.sort((x,y)=>(x.ai??9999)-(y.ai??9999)||(x.ti??0)-(y.ti??0));
  T.forEach(t=>{
    if(t.ai==null){meta.push({id:t.id,title:t.name,artist:'',album:'',no:0});return}
    const d=DISC[t.ai],ck=akA(t.ai);KD[ck]=t.ai;
    meta.push({id:t.id,title:t.name,artist:d.ar,album:d.t,no:t.ti+1});
    if(!IMG[ck]&&!tried[ck]){tried[ck]=1;arts.push([ck,t.id])}
  });
  if((view.l===2&&!DISC[view.ai])||(view.l===1&&!ARTS.includes(view.ar)))view={l:0};
  i=T.findIndex(t=>t.id===cur);
  Android.setMeta(JSON.stringify(meta));
  show(T[i]);render();
  arts.forEach(a=>{try{const b=Android.art(a[1]);if(b)setImg(a[0],b64blob(b))}catch(e){}});
}
function load(k,play){i=k;show(T[k]);render();if(play)Android.play(JSON.stringify(T.map(x=>x.id)),k)}
function del(k){Android.remove(T[k].id);sync()}
window.onLibrary=sync;
window.onNative=function(s){
  nat=s;const k=T.findIndex(t=>t.id===s.id);
  if(k!==i){i=k;show(T[k]);render()}
  $('pi').setAttribute('d',s.playing?'M6 4h4v16H6zM14 4h4v16h-4z':'M7 4v16l13-8z');
  if(!seeking){$('cur').textContent=fmt(s.pos/1000);$('seek').value=s.dur?s.pos/s.dur*1000:0}
  $('dur').textContent=fmt(s.dur/1000);dk.style.setProperty('--p',(s.dur?s.pos/s.dur*100:0)+'%');
};
$('addBtn').onclick=()=>Android.add();
$('play').onclick=()=>{if(nat.id)Android.toggle();else if(T.length)load(Math.max(i,0),true)};
$('next').onclick=()=>Android.next();
$('prev').onclick=()=>Android.prev();
$('shuf').onclick=e=>{shuf=!shuf;e.currentTarget.setAttribute('aria-pressed',shuf);Android.shuffle(shuf)};
$('rep').onclick=e=>{rep=rep==='off'?'all':rep==='all'?'one':'off';const b=e.currentTarget;b.dataset.m=rep;b.setAttribute('aria-pressed',rep!=='off');Android.repeat(rep==='off'?0:rep==='one'?1:2)};
$('seek').oninput=()=>{seeking=true};
$('seek').onchange=()=>{if(nat.dur)Android.seek(nat.dur*$('seek').value/1000);seeking=false};
setTimeout(()=>{if(!synced){synced=1;sync()}},1500);
</script>
